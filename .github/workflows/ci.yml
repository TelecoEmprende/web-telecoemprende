# Lo mismo que se ejecuta a mano en local (ver CLAUDE.md > Comandos), en cada
# PR a staging y a prod: un PR con tests rotos no se fusiona sin que se vea.
name: CI

on:
  pull_request:
    branches: [staging, prod]
  push:
    branches: [dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: telecoemprende
          POSTGRES_PASSWORD: telecoemprende
          POSTGRES_DB: telecoemprende_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U telecoemprende"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://telecoemprende:telecoemprende@localhost:5432/telecoemprende_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
