<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juego | TelecoEmprende</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <style>
      :root {
        --color-gold: #f4b044;
        --color-orange: #e0680e;
        --color-navy: #112532;
        --color-navy-deep: #0b1a24;
        --color-cream: #faf5ec;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: linear-gradient(175deg, var(--color-navy) 0%, var(--color-navy-deep) 100%);
        color: var(--color-cream);
        font-family: "Space Grotesk", "Inter", system-ui, sans-serif;
        text-align: center;
      }

      main {
        max-width: 46ch;
      }

      .eyebrow {
        display: inline-flex;
        padding: 8px 14px;
        margin-bottom: 20px;
        border-radius: 999px;
        background: rgba(244, 176, 68, 0.13);
        border: 1px solid rgba(244, 176, 68, 0.28);
        color: var(--color-gold);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(1.8rem, 4vw, 2.6rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }

      p {
        margin: 0 0 28px;
        font-size: 1.05rem;
        line-height: 1.7;
        color: #a9bcc9;
      }

      a {
        display: inline-flex;
        padding: 14px 32px;
        border-radius: 999px;
        background: var(--color-orange);
        color: var(--color-navy);
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="eyebrow">Próximamente</span>
      <h1>El juego está en construcción</h1>
      <p>
        Estamos preparando un mini-juego para que le eches un vistazo mientras
        decides si te unes a TelecoEmprende. Vuelve pronto para probarlo.
      </p>
      <a href="/">Volver a TelecoEmprende</a>
    </main>
  </body>
</html>
